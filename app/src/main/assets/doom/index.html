<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOOM</title>
  <link rel="stylesheet" href="https://v6.js.dos.zone/v6/build/js-dos.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    #dosbox { width: 100%; height: 100%; }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #ff2200;
    }
    #loader h1 {
      font-size: 52px;
      letter-spacing: 8px;
      text-shadow: 0 0 20px #ff2200, 0 0 40px #ff4400;
      animation: pulse 1s ease-in-out infinite alternate;
    }
    #loader p {
      color: #888;
      margin-top: 16px;
      font-size: 14px;
    }
    #progress-bar {
      margin-top: 24px;
      width: 280px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: #ff2200;
      width: 0%;
      transition: width 0.3s;
      border-radius: 3px;
    }
    #status { color: #555; font-size: 12px; margin-top: 10px; }
    @keyframes pulse {
      from { text-shadow: 0 0 20px #ff2200, 0 0 40px #ff4400; }
      to   { text-shadow: 0 0 30px #ff4400, 0 0 60px #ff6600; }
    }
  </style>
</head>
<body>
  <div id="loader">
    <h1>DOOM</h1>
    <p>Loading game engine...</p>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status">Connecting...</div>
  </div>

  <div id="dosbox"></div>

  <script src="https://v6.js.dos.zone/v6/build/js-dos.js"></script>
  <script>
    var statusEl = document.getElementById("status");
    var fillEl   = document.getElementById("progress-fill");
    var loaderEl = document.getElementById("loader");

    function setProgress(pct, msg) {
      fillEl.style.width = pct + "%";
      statusEl.textContent = msg;
    }

    setProgress(10, "Loading emulator...");

    // jsDOS v6 – runs DOOM shareware from Internet Archive
    emulators.pathPrefix = "https://v6.js.dos.zone/v6/build/";

    setProgress(30, "Starting DOSBox...");

    Dos(document.getElementById("dosbox")).ready(function(fs, main) {
      setProgress(50, "Downloading DOOM (may take a moment)...");

      // DOOM shareware ZIP from Internet Archive (free & legal)
      fs.extract("https://archive.org/download/doom-dos/DOOM.ZIP")
        .then(function() {
          setProgress(90, "Launching...");
          loaderEl.style.display = "none";
          main(["-c", "DOOM.EXE"]);
        })
        .catch(function(err) {
          statusEl.style.color = "#ff4444";
          statusEl.textContent = "Error: " + (err.message || err) +
            " — Check internet connection and try again.";
          fillEl.style.background = "#ff4444";
        });
    });
  </script>
</body>
</html>
